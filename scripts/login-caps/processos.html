<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      background: #e8f0f8 url("assets/processos-fundo.png") center / cover no-repeat;
    }
    .card {
      position: absolute;
      top: 50%;
      right: 72px;
      transform: translateY(-50%);
      width: 380px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 32px 28px;
      box-shadow: 0 8px 24px rgba(15,23,42,.12), 0 24px 48px rgba(15,23,42,.16);
      text-align: center;
    }
    .card img { width: 168px; height: auto; margin: 0 auto 10px; display: block; }
    .title { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: #0f172a; letter-spacing: -.02em; }
    .heading { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: #1e293b; }
    .lead { margin: 0 0 18px; font-size: 14px; color: #64748b; }
    label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: #475569; margin: 0 0 6px; }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: #0f172a;
    }
    .pw { position: relative; }
    .pw button {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: 0; background: transparent; color: #315efb; font-size: 12px; font-weight: 600; font-family: inherit;
    }
    .btn {
      width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 10px;
      background: linear-gradient(180deg, #3d6bff 0%, #315efb 100%);
      color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 4px 14px rgba(49,94,251,.35);
    }
  </style>
</head>
<body>
  <section class="card">
    <img src="assets/mcp.png" alt="" />
    <p class="title">Controle de processos</p>
    <h2 class="heading">Acesso ao sistema</h2>
    <p class="lead">Informe seu login e senha para entrar no painel.</p>
    <div class="field">
      <label>Login</label>
      <input type="text" placeholder="Seu login" />
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="pw">
        <input type="password" placeholder="••••••••" />
        <button type="button">Mostrar</button>
      </div>
    </div>
    <button class="btn" type="button">Entrar</button>
  </section>
</body>
</html>
