<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #0a0e1a url("assets/people-fundo.jpg") center / cover no-repeat; }
    .shade {
      width: 1600px; height: 900px; display: flex; align-items: center; justify-content: flex-end;
      padding: 40px 72px; box-sizing: border-box;
      background: linear-gradient(90deg, transparent 42%, rgba(5,12,28,.42) 100%);
    }
    .card {
      width: 400px; background: rgba(12,22,42,.78); border-radius: 16px; padding: 32px 28px;
      border: 1px solid rgba(100,180,255,.18); box-shadow: 0 24px 80px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 8px; color: #fff; font-size: 24px; font-weight: 700; }
    .hint { margin: 0 0 22px; color: rgba(203,213,225,.9); font-size: 14px; }
    label { display: block; color: #e2e8f0; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
    input {
      width: 100%; box-sizing: border-box; height: 42px; padding: 0 14px; margin-bottom: 16px;
      border-radius: 10px; border: 1px solid rgba(148,163,184,.35); background: #f8fafc; color: #0f172a; font-size: 14px;
    }
    .btn {
      width: 100%; height: 46px; border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 15px;
      background: linear-gradient(180deg, #3182ce 0%, #2b6cb0 45%, #2556a8 100%);
      box-shadow: 0 4px 16px rgba(49,130,206,.45);
    }
  </style>
</head>
<body>
  <div class="shade">
    <div class="card">
      <h1>Acessar sistema</h1>
      <p class="hint">Entre com seu usuário e senha para continuar.</p>
      <label>Usuário</label>
      <input placeholder="Digite seu usuário" />
      <label>Senha</label>
      <input type="password" placeholder="Digite sua senha" />
      <button class="btn" type="button">Entrar</button>
    </div>
  </div>
</body>
</html>
